; ESP32 "car tag" for IONIQ 6 walk-away auto-lock.
; Board: any classic ESP32 dev board (ESP-WROOM-32), e.g. ELEGOO ESP-WROOM-32.

[env:esp32dev]
; Pinned so the BLE API doesn't shift under us (Arduino-ESP32 2.0.x).
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
