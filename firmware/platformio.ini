; Walk-away Lock tag firmware. One environment per board family; CI builds all of them.
;   pio run -d firmware                  (all boards)
;   pio run -d firmware -e esp32c3 -t upload

[env]
; Pinned so the BLE API doesn't shift under us (Arduino-ESP32 2.0.x).
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Classic ESP32 (ESP32-WROOM-32 DevKit, ELEGOO/HiLetgo boards…). Blue LED on GPIO 2.
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"ESP32\"

; ESP32-C3 (e.g. "ESP32-C3 SuperMini"). Blue LED on GPIO 8, lit when the pin is low.
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"ESP32-C3\"
    -DLED_PIN=8
    -DLED_ACTIVE_LOW=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3 (e.g. ESP32-S3-DevKitC-1). RGB LED on GPIO 48 (some boards: 38).
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"ESP32-S3\"
    -DLED_PIN=48
    -DLED_RGB=1
