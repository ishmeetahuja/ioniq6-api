# Public identity for builds from this repository.
# These are the ids a stranger installs. Keep them different from any personal build
# on the same Apple team or the same Android phone.
#
# Server address, phone token and BlueLink login are NOT here. Each person types those
# into the app and into their own server's .env (see server/.env.example).

applicationId=io.github.ishmeetahuja.walkawaylock
appName=Walk-away Lock

# iOS uses the same id as the bundle identifier. The Xcode project is not in this
# repo yet; the TestFlight workflow reads this file when that project is added.
iosScheme=WalkawayLock
